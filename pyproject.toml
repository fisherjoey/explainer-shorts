[project]
name = "explainer-shorts"
version = "0.1.0"
description = "Voice, time and caption short explainer videos from a JSON script"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26",
  "soundfile>=0.12",
  "pyloudnorm>=0.1.1",
  "faster-whisper>=1.1",
]

[project.optional-dependencies]
tts = [
  "chatterbox-tts",
  # resemble-perth (chatterbox's watermarker) imports pkg_resources at runtime but does not
  # declare setuptools; setuptools>=81 removed pkg_resources, leaving PerthImplicitWatermarker=None.
  "setuptools<81",
  # F5-TTS engine (docs/voice.md). f5-tts>=1.1.22 needs gradio>=6.15 but chatterbox-tts
  # pins gradio==6.8.0, so the resolver settles on f5-tts 1.1.20; neither engine imports gradio.
  "f5-tts",
]

[project.scripts]
explainer = "explainer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
override-dependencies = ["torch>=2.9", "torchaudio>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py/explainer"]

[tool.pytest.ini_options]
pythonpath = ["py"]
testpaths = ["tests/py"]
